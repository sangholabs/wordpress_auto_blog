# 저장소 기본 설정. 실제 PC에서 메뉴로 바꾼 값은 settings.local.yaml에 저장된다.

content:
  min_chars: 1800          # 애드센스/SEO 기준 최소 분량
  toc: true                # 목차 자동 생성
  coupang_disclosure: "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다."
  featured_image: true     # 대표 이미지 자동 생성(Pollinations 무료). 끄려면 false
  banner_layout: per_h2    # per_h2(소제목마다 서로 다른 배너 1개씩) | grouped(한 자리에 모아) | grouped_h2(한 자리+소제목마다 그룹)
  max_banners: 2           # 글 전체 배너 수(보유 배너 개수 한도 내). 애드센스 심사 중엔 1~2 권장
  h2_groups: 3             # grouped_h2 전용

publish:
  status: publish          # 즉시 공개 발행 (검수 필요 시 draft 로 되돌림)
  posts_per_day: 3
  schedule_time: "09:00"   # 자동발행 시각(Windows 작업 스케줄러 / macOS launchd)

llm:
  anthropic_model: "claude-sonnet-4-6"   # LLM_PROVIDER=anthropic 일 때
  gemini_model: "gemini-3.6-flash"       # LLM_PROVIDER=gemini 일 때
  max_tokens: 8192
  request_timeout_sec: 600

keyword_research:
  request_delay_sec: 0.5   # 요청 간 대기(과도한 호출 방지)
  timeout_sec: 10
  use_google: true         # 구글 자동완성 사용
  use_naver: true          # 네이버 자동완성 사용

topic_queue:
  intent_words: ["추천", "비교", "후기", "순위", "가성비", "best", "TOP", "단점", "vs"]  # 구매의도 신호(점수 가산)
  longtail_min_words: 2    # 롱테일 가산 단어 수 범위
  longtail_max_words: 5
  one_per_product: true    # 같은 상품 뿌리 단어는 1개만(유사 중복 글 방지)

design:
  max_width_px: 720        # 본문 최대 폭
  font_size_px: 18         # 본문 글자 크기
  line_height: 1.8
  primary_color: "#2d6cdf" # 소제목 선·목차·버튼 색
  price_color: "#d6293e"   # 가격 강조 색
  font_family: "-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif"

coupang:
  rocket_only: true        # 로켓배송/로켓프레시/로켓직구 상품만 수집(신뢰도·전환율↑)
  products_per_post: 5     # 글당 상품 카드 수
  search_limit: 5          # 쿠팡 API 검색 상품 수
  api_timeout_sec: 15      # 쿠팡 API 타임아웃
  scraper_port: 9222       # 스크래퍼 CDP 연결 포트(디버깅 Chrome)
  wp_banner_shortcode: ""  # iframe 배너는 방화벽에 안 막혀 직접 삽입한다. (script 배너로 막히면 "[coupang_dynamic_banner]" 로 숏코드 사용)

# 국가정책 수집 → 검토 → 티스토리 수동 게시 패키지 생성 전용 설정.
# 기존 WordPress 자동발행 설정과 서로 독립적으로 동작한다.
policy_workspace:
  auto_generate: false    # 티스토리 패키지 자동 생성(자동 게시 아님)
  schedule_time: "09:30" # WordPress 자동발행과 독립된 실행 시각
  packages_per_day: 1     # 매일 자동으로 만들 티스토리 패키지 수
  candidate_refresh_hours: 24 # 후보 풀이 이 시간보다 오래되면 전체 재수집
  scan_page_size: 500      # 보조금24 페이지당 조회 수
  scan_limit: 5000         # 첫 페이지만 보지 않고 이 범위까지 고르게 검사
  use_support_conditions: true  # 근로자·가구·연령·전문업종 공식 조건을 선별에 사용
  recommended_limit: 50    # 자동 추천 목록에 남길 최대 후보 수
  detail_limit: 30         # 추천 상위 후보 중 상세정보를 추가 조회할 수
  minimum_score: 20        # 30~50대 생활밀착 추천 최소 점수
  source_cache_days: 7     # 공식 출처 재확인 실패 시 허용할 캐시 최대 일수
  image_provider: openai   # openai 기본, Pollinations는 글/이미지별 수동 선택
  image_model: "gpt-image-2"
  image_quality: medium
  image_timeout_sec: 360
  images_enabled: true     # 티스토리 대표 1장·본문 2장 생성. WordPress 대표이미지 설정과 독립
  supabase_upload_enabled: true  # 생성 이미지를 Supabase 공개 버킷에 올려 게시 HTML에 URL 삽입
  coupang_enabled: true
  coupang_layout: per_h2
  coupang_max_blocks: 2
  rocket_only: true
  seo_title_min: 28
  seo_title_max: 45
  seo_description_min: 80
  seo_description_max: 155
  seo_min_body_chars: 1800
  seo_pass_score: 80
  seo_review_score: 60
